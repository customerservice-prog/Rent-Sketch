name: Phase 4 verified implementation
on:
  push:
    branches: [qa/phase4-linens-20260929]
    paths: ['.github/phase4-payload/**', '.github/workflows/phase4-apply-qa.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  phase4-implementation:
    if: github.ref == 'refs/heads/qa/phase4-linens-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/phase4-linens-20260929
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact hash-checked source changes on QA branch
        run: |
          python3 - <<'PY'
          import pathlib,base64,gzip,json,hashlib
          root=pathlib.Path.cwd(); parts=sorted(root.glob('.github/phase4-payload/part-*.b64'))
          assert len(parts)==4
          payload=json.loads(gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)))
          updates=[]
          for change in payload:
            path=pathlib.PurePosixPath(change['path'])
            assert not path.is_absolute() and '..' not in path.parts
            assert path.parts[0] in ['js','server','tests','catalog-preview','dashboard','designer','docs']
            file=root/path
            old=file.read_text() if file.exists() else None
            if old is not None and hashlib.sha256(old.encode()).hexdigest()==change['after']:continue
            if change['before'] is None:
              assert old is None, str(path)+' already exists'
              new=change['content']
            else:
              assert old is not None and hashlib.sha256(old.encode()).hexdigest()==change['before'], str(path)+' changed since baseline'
              new=old
              for start,end,text in reversed(change['edits']):new=new[:start]+text+new[end:]
            assert hashlib.sha256(new.encode()).hexdigest()==change['after'],str(path)+' post-edit mismatch'
            updates.append((file,new))
          for file,new in updates:file.parent.mkdir(parents=True,exist_ok=True);file.write_text(new)
          print('Verified',len(payload),'source files;',len(updates),'applied')
          # Test-only local server must serve index.html for directory URLs.
          f=root/'tests/phase4-capture.cjs';s=f.read_text();s=s.replace("try{let data=fs.readFileSync(file);", "try{if(fs.statSync(file).isDirectory())file=path.join(file,'index.html');let data=fs.readFileSync(file);");f.write_text(s)
          PY
          git diff --check
      - run: npm --prefix tests ci
      - run: npm install --prefix /tmp/phase4-browser --no-save playwright@1.56.1
      - run: /tmp/phase4-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Read live public product and image references
        run: |
          node <<'JS'
          const fs=require('fs');
          (async()=>{
            fs.mkdirSync('qa-phase4/references',{recursive:true});
            const read=async url=>{const r=await fetch(url,{signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error(url+' '+r.status);return r.json();};
            const catalog=await read('https://rentsketch-api-production.up.railway.app/api/tenants/friendly/products'),website=await read('https://www.friendlypartyrental.com/api/items');
            fs.writeFileSync('qa-phase4/catalog.json',JSON.stringify(catalog));fs.writeFileSync('qa-phase4/website.json',JSON.stringify(website));
            const items=[];
            for(const p of catalog.products){
              if(!String(p.external_id||'').startsWith('fpr:'))continue;
              const slug=p.external_id.slice(4),w=website.items.find(x=>x.slug===slug);
              if(!(p.category==='linen'||/charger|\bplate\b|\bfork\b|\bspoon\b|\bknife\b|goblet|martini|wine glass|beer glass|rocks glass|coffee mug|carafe/i.test(p.name)))continue;
              const row={productId:p.id,slug,name:p.name,error:null};
              try{if(!w?.picture)throw Error('No website image');const url=new URL(w.picture,'https://www.friendlypartyrental.com');const r=await fetch(url,{signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error('Image '+r.status);fs.writeFileSync('qa-phase4/references/'+slug+'.img',Buffer.from(await r.arrayBuffer()));}catch(e){row.error=e.message;}
              items.push(row);
            }
            fs.writeFileSync('qa-phase4/manifest.json',JSON.stringify({items,checkedAt:new Date().toISOString()},null,2));
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Run geometry and compatibility regression checks
        run: |
          set -o pipefail
          node --test tests/phase4-linens.test.mjs tests/furniture-accuracy.test.mjs tests/furniture-catalog.test.mjs tests/furniture-seating.test.mjs tests/furniture-placement.test.mjs tests/contextual-products.test.mjs | tee qa-phase4/unit-tests.log
          node --experimental-vm-modules tests/phase4-render.cjs | tee qa-phase4/geometry-tests.log
          node --experimental-vm-modules tests/furniture-mesh.cjs
          node --experimental-vm-modules tests/furniture-plan-dom.cjs
      - name: Render every Phase 4 product and check desktop/mobile audit views
        env:
          NODE_PATH: /tmp/phase4-browser/node_modules
        run: node tests/phase4-capture.cjs
      - name: Save tested implementation to QA branch only
        run: |
          git config user.name 'RentSketch QA'
          git config user.email 'rentsketch-qa@users.noreply.github.com'
          git add js server/src tests/phase4* catalog-preview dashboard designer docs/phase4-linens-20260929.md
          if ! git diff --cached --quiet; then git commit -m 'Implement photo-referenced linens and tabletop with verified catalog colors'; git push origin HEAD:refs/heads/qa/phase4-linens-20260929; fi
          git rev-parse HEAD > qa-phase4/tested-commit.txt
      - name: Package tested runtime source
        if: always()
        run: tar -czf qa-phase4/runtime-source.tgz js server/src tests/phase4* catalog-preview dashboard designer script.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-tested-implementation
          path: qa-phase4
          retention-days: 7
