name: Catalog visual evidence
on:
  push:
    branches: [qa/catalog-visual-20260929]
permissions:
  contents: read
concurrency:
  group: catalog-visual-qa
  cancel-in-progress: true
jobs:
  visual-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix tests ci
      - run: npm install --prefix /tmp/catalog-browser --no-save playwright@1.56.1
      - run: /tmp/catalog-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture public reference photos and actual renderer
        env:
          NODE_PATH: /tmp/catalog-browser/node_modules
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/catalog-http.log 2>&1 &
          node tests/catalog-visual-browser.cjs
      - name: Run focused regression tests
        if: always()
        run: |
          mkdir -p qa-catalog
          node --test tests/contextual-products.test.mjs tests/inflatable-state.test.mjs tests/furniture-catalog.test.mjs > qa-catalog/tests.log 2>&1
          node --experimental-vm-modules tests/inflatable-state-mesh.cjs >> qa-catalog/tests.log 2>&1
          node --experimental-vm-modules tests/tent-mesh.cjs >> qa-catalog/tests.log 2>&1
          node --experimental-vm-modules tests/catalog-photo-geometry.cjs >> qa-catalog/tests.log 2>&1
          cat qa-catalog/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-visual-evidence
          retention-days: 7
          path: qa-catalog/
