name: Friendly NYC tenant regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tenant:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: NYC tenant, catalog and booking isolation
        run: node --test tests/friendly-catalog-sync.test.mjs tests/booking-handoff.test.mjs tests/friendly-nyc-tenant.test.mjs
      - name: Install recovery-test dependencies
        run: npm --prefix tests ci
      - name: Included-order recovery and access DOM regression
        run: |
          node --experimental-vm-modules tests/event-pass-dom.cjs
          node tests/access-recovery.cjs
