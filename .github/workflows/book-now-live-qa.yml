name: Live Book Now checkout verification
on:
  push:
    branches: [qa/book-now-20260929]
    paths: ['tests/book-now-live-browser.cjs', '.github/workflows/book-now-live-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/booking-browser --no-save playwright@1.56.1
      - run: /tmp/booking-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Wait for the new receiving page to become live
        run: |
          node <<'JS'
          (async()=>{for(let i=0;i<24;i++){try{const r=await fetch('https://www.friendlypartyrental.com/design-your-event/book?qa='+Date.now(),{signal:AbortSignal.timeout(10000)});if(r.ok&&(await r.text()).includes('data-rentsketch-checkout')){console.log('New receiving page is live');return;}}catch{}await new Promise(r=>setTimeout(r,10000));}throw Error('Updated checkout receiver is not live');})().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Test public cart transfer without any live writes
        env:
          NODE_PATH: /tmp/booking-browser/node_modules
        run: node tests/book-now-live-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-now-live-browser-evidence
          path: qa-book-now-live
          retention-days: 7
