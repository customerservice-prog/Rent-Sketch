name: Verify live catalog release
on:
  push:
    branches: [qa/catalog-visual-20260929]
    paths: [.github/workflows/catalog-live-verify.yml]
permissions:
  contents: read
jobs:
  live-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check production pages and exact renderer bytes
        run: |
          mkdir -p qa-live-catalog
          node <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const entries=[
           ['js/ui/inflatable3d.js','?v=20260929-catalog-accuracy-1'],
           ['js/data/inflatables.js','?v=20260929-catalog-accuracy-1'],
           ['js/ui/inflatable-reference3d.js',''],
           ['js/ui/inflatable-generic3d.js',''],
           ['js/ui/tent3d.js','?v=20260929-sidewall-window-2'],
           ['js/ui/tent-base3d.js',''],
           ['js/ui/window-wall3d.js',''],
           ['js/core/contextual-products.js','?v=20260929-sidewall-rules-2']
          ];
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          (async()=>{
           let results=[];
           for(let attempt=0;attempt<48;attempt++){
            results=await Promise.all(entries.map(async([file,query])=>{
             try{const response=await fetch('https://rentsketch.com/'+file+query,{cache:'no-store',signal:AbortSignal.timeout(15000)}),body=Buffer.from(await response.arrayBuffer());
              return {file,status:response.status,cacheControl:response.headers.get('cache-control'),expected:hash(fs.readFileSync(file)),actual:hash(body),match:response.ok&&hash(fs.readFileSync(file))===hash(body)};
             }catch(e){return {file,match:false,error:String(e)};}
            }));
            if(results.every(r=>r.match))break;
            await new Promise(r=>setTimeout(r,5000));
           }
           const response=await fetch('https://rentsketch.com/designer/?tenant=friendly&source=home_designer_section',{cache:'no-store',signal:AbortSignal.timeout(15000)}),html=await response.text();
           const report={verifiedAt:new Date().toISOString(),sourceCommit:process.env.GITHUB_SHA,files:results,designer:{status:response.status,hasThreeImport:html.includes('three@0.160.0'),hasCanvas:html.includes('id="canvas"')}};
           fs.writeFileSync('qa-live-catalog/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
           if(!results.every(r=>r.match)||!response.ok||!report.designer.hasCanvas)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-catalog-release-check
          retention-days: 7
          path: qa-live-catalog/
