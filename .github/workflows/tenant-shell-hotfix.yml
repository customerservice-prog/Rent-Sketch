name: Tenant shell hotfix QA
on:
  push:
    branches: [qa/tenant-shell-hotfix-20261001]
permissions:
  contents: read
jobs:
  tenant-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix tests ci
      - run: npm install --prefix /tmp/tenant-shell-qa --no-save playwright@1.56.1
      - run: /tmp/tenant-shell-qa/node_modules/.bin/playwright install --with-deps chromium
      - run: NODE_PATH=/tmp/tenant-shell-qa/node_modules node tests/tenant-workspace-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenant-shell-hotfix-evidence
          path: qa-tenant-workspace/
          retention-days: 7
